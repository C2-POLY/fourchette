[package]
name = "fourchette"
version = "0.5.0"
edition = "2021"
rust-version = "1.95"
description = "A Git client for macOS in Rust and egui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/C2-POLY/fourchette"
homepage = "https://c2-poly.github.io/fourchette/"

[dependencies]
# wgpu (Metal) instead of the default glow (OpenGL): glow shows stale or stretched frames during a live resize on macOS.
# Of the other default features, only accesskit, clipboard, default_fonts and links are kept (clipboard lets ctx.copy_text reach the pasteboard, links lets ctx.open_url open the browser).
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wgpu"] }
# The symbols some labels still use (a check mark, a sparkle) come from egui's emoji fonts,
# which egui 0.37 no longer loads by default.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.15"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Draws the app icon in the colour chosen in Settings (anti-aliased paths, round caps, gradients),
# pure Rust; its own PNG support is left out, `image` already encodes.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# The menu bar and the window buttons go through AppKit; the same versions eframe and winit already use.
[target.'cfg(target_os = "macos")'.dependencies]
# eframe's wgpu feature enables no backend by itself: Metal, with the WGSL shaders egui uses.
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSCell", "NSEvent", "NSPasteboard", "NSUserInterfaceValidation", "NSWindow", "NSView", "NSButton", "NSControl", "NSImage", "NSWorkspace", "NSSharingService", "NSSound", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSDictionary", "NSObject", "NSArray", "NSNotification", "NSOperation", "NSData", "NSURL", "block2"] }

[profile.release]
opt-level = 3

# The app icon in a chosen colour (#159) takes a second to draw with tiny-skia unoptimised;
# optimised, a debug build draws it in about as long as a release one.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
