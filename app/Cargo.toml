[package]
name = "fourchette"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
eframe = "0.32"
egui = "0.32"
rfd = "0.15"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# The Dock icon is swapped at runtime through AppKit; the same versions eframe and winit already use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSGeometry"] }

[profile.release]
opt-level = 3
