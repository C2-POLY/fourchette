# The companion's Xcode project, generated by XcodeGen: `xcodegen` from `ios/` writes
# Companion.xcodeproj (ignored by Git), so the project is reviewed as this file.
name: Companion
options:
  bundleIdPrefix: com.c2poly.fourchette
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Companion:
    type: application
    platform: iOS
    sources: [Companion]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c2poly.fourchette.companion
        PRODUCT_NAME: Fourchette
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fourchette
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Merged with the generated keys: the GitHub OAuth App's client id, from Config.xcconfig.
        INFOPLIST_FILE: Companion/Info.plist
        CODE_SIGN_STYLE: Automatic
  CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CompanionTests]
    dependencies:
      - target: Companion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Fourchette.app/Fourchette
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Companion:
    build:
      targets:
        Companion: all
        CompanionTests: [test]
    test:
      targets: [CompanionTests]
